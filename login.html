<!doctype html>
<html lang="en" data-i18n-loading>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https://*.googleapis.com https://www.gstatic.com https://www.google.com; frame-src https://www.google.com https://cinepath-2c233.firebaseapp.com https://accounts.google.com https://apis.google.com; object-src 'none'; base-uri 'self'; form-action 'self' mailto:" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#050505" />
    <title data-i18n="meta.login">Log in — CinePath</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/auth.css" />
    <link rel="stylesheet" href="assets/css/i18n.css" />
</head>
<body>
    <div class="auth-bg"></div>

    <a href="index.html" class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span data-i18n="nav.home">Home</span>
    </a>

    <div class="auth-lang" data-lang-switcher></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="brand-logo"><span>CINE</span>PATH</a>
                <h1 class="auth-title" data-i18n="auth.welcome">Welcome back!</h1>
                <p class="auth-subtitle" data-i18n="auth.loginSubtitle">Please log in to your account to continue</p>
            </div>

            <div class="social-buttons" style="grid-template-columns: 1fr;">
                <button class="btn-social" type="button" id="googleBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
                    <span data-i18n="auth.google">Continue with Google</span>
                </button>
            </div>
            
            <div class="divider"><span data-i18n="auth.orEmail">or with email</span></div>

            <form id="loginForm" data-auth="login">
                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" autocomplete="email" class="form-input" placeholder="Email address" data-i18n-attr="placeholder:auth.email" required>
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" autocomplete="current-password" class="form-input" placeholder="Password" required data-i18n-attr="placeholder:auth.password">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" name="remember" checked>
                        <span data-i18n="auth.remember">Remember me</span>
                    </label>
                    <a href="#" class="forgot-link" id="forgotLink" data-i18n="auth.forgot">Forgot password?</a>
                </div>

                <div class="error-message" data-error role="alert" aria-live="polite"></div>
                <button type="submit" class="btn-primary" data-i18n="nav.login">Log In</button>
            </form>

            <div class="form-footer">
                <span data-i18n="auth.noAccount">Don't have an account?</span> <a href="signup.html" data-i18n="auth.signup">Sign Up</a>
            </div>
            <p class="legal-hint legal-hint-center" data-i18n-html="auth.legalNote">By continuing you accept the <a href="terms.html">Terms of Use</a> and the <a href="privacy.html">Privacy Notice</a>.</p>

            <div class="fp-modal" id="fpModal">
                <div class="fp-content">
                    <h3 data-i18n="auth.resetTitle">Password Reset</h3>
                    <p data-i18n="auth.resetText">Enter your email address and we'll send you a reset link.</p>
                    <input type="email" id="fpEmail" autocomplete="email" class="fp-input" placeholder="Your email address" data-i18n-attr="placeholder:auth.yourEmail">
                    <div class="fp-actions">
                        <button type="button" class="btn-fp-cancel" id="fpCancel" data-i18n="common.cancel">Cancel</button>
                        <button type="button" class="btn-fp-send" id="fpSend" data-i18n="auth.sendLink">Send Link</button>
                    </div>
                    <div id="fpMessage" class="fp-message"></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="assets/js/pages/login.js"></script>
</body>
</html>
